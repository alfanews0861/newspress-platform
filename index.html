<!doctype html>
<html lang="en" data-theme="light">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="NewsPress Platform | Newspaper Production & Marketplace SaaS" />
    <meta property="og:description" content="Multi-tenant SaaS newspaper production and news marketplace platform for independent news organizations, editorial desks, and reporters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chathura:wght@700;800&family=Dhurjati&family=Gidugu&family=Gurajada&family=Mallanna&family=Mandali&family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Noto+Sans+Telugu:wght@400;500;600;700;800;900&family=Noto+Serif+Telugu:wght@400;600;700;900&family=Peddana&family=Ramabhadra&family=Suranna&family=Tenali+Ramakrishna&family=Timmana&family=Roboto+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('newspress_theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <style>
      @media print {
        @page {
          size: 210mm 297mm; /* Standard A4 Paper */
          margin: 0mm;
        }
        html[data-print-format="broadsheet"] {
          width: 350mm !important;
          height: 540mm !important;
        }
        html[data-print-format="broadsheet"] .print-page-sheet {
          width: 350mm !important;
          height: 540mm !important;
        }
        html[data-print-format="broadsheet"] .print-page-inner {
          transform: scale(1.88976) !important;
        }
        html, body {
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .print-newspaper-export-container {
          display: block !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
        }
        .print-page-sheet {
          width: 210mm !important;
          height: 297mm !important;
          page-break-after: always !important;
          break-after: page !important;
          position: relative !important;
          overflow: hidden !important;
          margin: 0 !important;
          padding: 0 !important;
          box-sizing: border-box !important;
          background: #ffffff !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }
        .print-page-inner {
          width: 700px !important;
          height: 1080px !important;
          transform: scale(1.0388) !important;
          transform-origin: center center !important;
          position: relative !important;
          box-sizing: border-box !important;
          flex-shrink: 0 !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#f8fafd] text-[#000000] font-sans antialiased selection:bg-blue-100 selection:text-blue-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
